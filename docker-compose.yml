# ==============================================================================
# TicketDot Docker Compose
# ==============================================================================
# Brings up the complete stack with:
#   docker compose up --build
#
# Services:
#   - db: PostgreSQL 16 database with health check
#   - api: Go backend running on port 8080 (non-root user, multi-stage)
#   - web: React frontend served by Nginx with SPA routing fallback
#
# Environment variables can be overridden via a .env file or host environment.
# Secrets are supplied via environment variables; never hardcoded into images.
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ticketdot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ticketdot}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ticketdot_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ticketdot}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Backend API Service (Go 1.22 multi-stage, non-root user)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketdot-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Application environment (development | production)
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      # Database connection string pointing to the db service
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ticketdot}?sslmode=disable
      # JWT signing secret (minimum 32 characters in production)
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-this-to-a-very-long-32-chars-string}
      # Payment gateway credentials
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TicketDotDemo}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_secret_TicketDotDemo}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-webhook_secret_TicketDotDemo}
      # Allowed CORS origins
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80,http://localhost:5173,http://localhost:5174,http://localhost}
      # Rate limiting settings
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      SIGNUP_RATE_LIMIT: ${SIGNUP_RATE_LIMIT:-10}
      FORGOT_PASSWORD_RATE_LIMIT: ${FORGOT_PASSWORD_RATE_LIMIT:-5}
      GLOBAL_RATE_LIMIT: ${GLOBAL_RATE_LIMIT:-120}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}

  # ----------------------------------------------------------------------------
  # Frontend Web Service (React 19 + Vite served via Nginx with SPA fallback)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ../ticketdot-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: ticketdot-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  ticketdot_db_data:
    driver: local
