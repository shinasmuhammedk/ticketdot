name: Backend CI

on:
  push:
    branches: [ main, master, 'chore/**', 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build, Vet & Race Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: busticket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Compile all binaries & packages
        run: go build -v ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Run tests with -race against PostgreSQL
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/busticket_test?sslmode=disable"
          APP_ENV: "development"
          JWT_SECRET: "dev-jwt-secret-ticketdot-ci-must-be-at-least-32-chars"
        run: |
          set -o pipefail
          go test -race -v ./... | tee test_output.log

      - name: Verify no payment security tests were skipped
        run: |
          if grep -q "skipping payment test" test_output.log; then
            echo "::error::Payment security tests were skipped! DATABASE_URL integration is required."
            exit 1
          fi
          echo "Success: All payment security tests executed against real PostgreSQL with 0 skips."
